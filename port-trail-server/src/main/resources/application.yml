server:
  port: 29892
  servlet:
    context-path: /pts

spring:
  application:
    name: port-trail-server
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
      enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: true
    deserialization:
      fail-on-unknown-properties: false

  # 数据库、redis 的连接信息放在同级目录的 db_config.txt / redis_config.txt 中（均已加入 .gitignore）。
  # 这两个文件不是 Spring 默认识别的后缀，所以用 [.properties] 扩展名提示，让 Spring 按 properties 格式解析。
  config:
    import:
      - "classpath:db_config.txt[.properties]"
      - "classpath:redis_config.txt[.properties]"

port-trail:
  analyze:
    # SQL 解析线程池。JSqlParser 是 CPU 密集操作，线程数不必超过容器 CPU limit
    sql-parse:
      threads: 8
      queue-capacity: 8
    # 去重记录（AnalyzeDedupHandler）的阈值与缓存时长
    dedup:
      cost-threshold-ms: 1000              # cost 超过该值判定为慢 SQL
      in-threshold: 200                    # IN 元素个数超过该值判定为 IN 过多
      cache-ttl-ms: 172800000              # 2 天：去重标记 + explain 结论
      sql-parse-cache-ttl-ms: 604800000    # 7 天：解析结论（只取决于 SQL 文本）
      explain-none-ttl-ms: 3600000         # 1 小时：explain 未发现全表扫描的负缓存；0 表示不缓存
    # handler 路由规则表：分号分隔多条，每条为 systemCode|serviceName|env|handler1,handler2
    # 按顺序匹配，首条命中即生效；字段支持 * 通配（纯星号 pattern 匹配一切，含 null；其余 pattern 不匹配 null）；
    # 无任何规则命中时不执行任何 handler（不分析）。
    # 注意：值以 * 开头时 YAML 会当成别名，整个值要用引号包起来。
    # 灰度：sit 只跑 AnalyzeDedupHandler（statement 链路因 dedup 只支持 prepared 而不再分析）；
    handler-rules: "*|*|sit|AnalyzeDedupHandler;*|*|*|AnalyzeExplainHandler,AnalyzeTableNameHandler,AnalyzeSelectAllHandler"

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement
  type-handlers-package: cn.addenda.porttrail.
